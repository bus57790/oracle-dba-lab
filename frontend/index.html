<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Oracle 19c DBA Control Center - ORCLPDB</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- React & ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <!-- Babel for in-browser JSX transformation -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        function App() {
            const [activeModule, setActiveModule] = useState(null);
            const [sqlOutput, setSqlOutput] = useState('-- Select a module action to generate Oracle 19c SQL/PL*SQL command');
            const [copied, setCopied] = useState(false);
            const [toast, setToast] = useState('');

            const showToast = (msg) => {
                setToast(msg);
                setTimeout(() => setToast(''), 3000);
            };

            const copyToClipboard = (text) => {
                navigator.clipboard.writeText(text);
                setCopied(true);
                showToast('SQL script copied to clipboard!');
                setTimeout(() => setCopied(false), 2000);
            };

            const generateSql = (type, details) => {
                let sql = '';
                switch(type) {
                    case 'user':
                        sql = `-- Oracle 19c User Management (${details.action})\n` +
                              `ALTER SESSION SET CONTAINER = ORCLPDB;\n` +
                              `CREATE USER ${details.username || 'app_user'} IDENTIFIED BY "${details.password || 'SecureP@ss123'}"\n` +
                              `DEFAULT TABLESPACE users\n` +
                              `TEMPORARY TABLESPACE temp\n` +
                              `QUOTA UNLIMITED ON users;\n\n` +
                              `GRANT CREATE SESSION, RESOURCE TO ${details.username || 'app_user'};\n` +
                              `COMMIT;`;
                        break;
                    case 'tablespace':
                        sql = `-- Oracle 19c Tablespace Expansion (${details.name})\n` +
                              `ALTER SESSION SET CONTAINER = ORCLPDB;\n` +
                              `ALTER TABLESPACE ${details.name || 'USERS'}\n` +
                              `ADD DATAFILE '/u01/app/oracle/oradata/ORCL/orclpdb/${(details.name || 'users').toLowerCase()}_02.dbf'\n` +
                              `SIZE 2G AUTOEXTEND ON NEXT 500M MAXSIZE UNLIMITED;`;
                        break;
                    case 'lifecycle':
                        sql = `-- Oracle 19c Instance Lifecycle Management\n` +
                              `-- Target: //192.168.1.184:1521/ORCL (${details.action})\n` +
                              `CONNECT sys/Password123@//localhost:1521/ORCL AS SYSDBA;\n` +
                              `SHUTDOWN IMMEDIATE;\n` +
                              `STARTUP;\n` +
                              `ALTER PLUGGABLE DATABASE ORCLPDB OPEN;`;
                        break;
                    case 'performance':
                        sql = `-- Oracle 19c Session Diagnostics & Termination\n` +
                              `ALTER SESSION SET CONTAINER = ORCLPDB;\n` +
                              `SELECT sid, serial#, username, status, sql_id, event \n` +
                              `FROM v\$session WHERE status = 'ACTIVE' AND username IS NOT NULL;\n\n` +
                              `-- Kill target session:\n` +
                              `ALTER SYSTEM KILL SESSION '${details.sid || 142}, ${details.serial || 48201}' IMMEDIATE;`;
                        break;
                    case 'rman':
                        sql = `-- Oracle 19c RMAN Backup Execution\n` +
                              `RMAN TARGET /;\n` +
                              `RUN {\n` +
                              `  ALLOCATE CHANNEL c1 DEVICE TYPE DISK;\n` +
                              `  BACKUP AS COMPRESSED BACKUPSET DATABASE \n` +
                              `    INCLUDE CURRENT CONTROLFILE \n` +
                              `    PLUS ARCHIVELOG;\n` +
                              `  RELEASE CHANNEL c1;\n` +
                              `}\n` +
                              `EXIT;`;
                        break;
                    case 'audit':
                        sql = `-- Oracle 19c Unified Audit Logs Query\n` +
                              `ALTER SESSION SET CONTAINER = ORCLPDB;\n` +
                              `SELECT event_timestamp, dbusername, action_name, return_code\n` +
                              `FROM unified_audit_trail\n` +
                              `WHERE dbusername = '${details.username || 'SYS'}'\n` +
                              `  AND event_timestamp >= SYSTIMESTAMP - INTERVAL '1' DAY\n` +
                              `ORDER BY event_timestamp DESC;`;
                        break;
                    default:
                        sql = '-- Select an operation to view script';
                }
                setSqlOutput(sql);
            };

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 flex flex-col">
                    {/* Toast Notification */}
                    {toast && (
                        <div className="fixed top-5 right-5 z-50 bg-emerald-600 text-white px-4 py-2 rounded-lg shadow-lg text-sm font-medium transition-all">
                            {toast}
                        </div>
                    )}

                    {/* Top Header */}
                    <header className="bg-slate-900 border-b border-slate-800 px-6 py-4 flex flex-col md:flex-row justify-between items-start md:items-center gap-4">
                        <div>
                            <div className="flex items-center gap-3">
                                <h1 className="text-xl font-bold tracking-tight text-white">Oracle DBA Control Center</h1>
                                <span className="bg-emerald-500/10 text-emerald-400 text-xs font-semibold px-2.5 py-0.5 rounded-full border border-emerald-500/20">
                                    Connected
                                </span>
                            </div>
                            <p className="text-xs text-slate-400 mt-1">
                                Development Environment &bull; <span className="text-cyan-400 font-mono">//192.168.1.184:1521/ORCL</span> &bull; PDB: <strong className="text-slate-200">ORCLPDB</strong>
                            </p>
                        </div>
                        <div className="flex items-center gap-3 text-xs">
                            <span className="bg-slate-800 px-3 py-1.5 rounded-md text-slate-300 font-mono">GitOps: Argo CD synced</span>
                            <button 
                                onClick={() => showToast('Refreshing Oracle metrics from ORCL...')} 
                                className="bg-cyan-600 hover:bg-cyan-500 text-white px-3 py-1.5 rounded-md font-medium transition">
                                Refresh Metrics
                            </button>
                        </div>
                    </header>

                    {/* Main Content Area */}
                    <main className="flex-1 p-6 max-w-7xl mx-auto w-full space-y-6">
                        
                        {/* Status Cards Grid */}
                        <div className="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-4">
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">DB Status</span>
                                <div className="text-2xl font-bold text-emerald-400 mt-1">OPEN</div>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">Active Sessions</span>
                                <div className="text-2xl font-bold text-white mt-1">24</div>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">Tablespace Used</span>
                                <div className="text-2xl font-bold text-amber-400 mt-1">68%</div>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">Last Backup</span>
                                <div className="text-lg font-bold text-emerald-400 mt-1">Success</div>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">Invalid Objects</span>
                                <div className="text-2xl font-bold text-rose-400 mt-1">3</div>
                            </div>
                            <div className="bg-slate-900/80 border border-slate-800 p-4 rounded-xl">
                                <span className="text-xs font-medium text-slate-400">DB Uptime</span>
                                <div className="text-2xl font-bold text-white mt-1">12 days</div>
                            </div>
                        </div>

                        {/* Management Modules Grid */}
                        <div>
                            <h2 className="text-lg font-semibold text-white mb-4">Management Modules</h2>
                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-5">
                                
                                {/* Module 1: User Management */}
                                <div onClick={() => { setActiveModule('user'); generateSql('user', {action: 'Create User'}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-cyan-500/10 text-cyan-400 rounded-lg group-hover:bg-cyan-500 group-hover:text-slate-950 transition">
                                            👤
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">ORCLPDB</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">User Management</h3>
                                    <p className="text-xs text-slate-400 mt-1">Create, lock, unlock and audit database users and permissions.</p>
                                </div>

                                {/* Module 2: Tablespaces */}
                                <div onClick={() => { setActiveModule('tablespace'); generateSql('tablespace', {name: 'USERS'}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-amber-500/10 text-amber-400 rounded-lg group-hover:bg-amber-500 group-hover:text-slate-950 transition">
                                            💾
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">ORCLPDB</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">Tablespaces</h3>
                                    <p className="text-xs text-slate-400 mt-1">Monitor space usage, resize datafiles, and manage capacity changes.</p>
                                </div>

                                {/* Module 3: Instance Lifecycle */}
                                <div onClick={() => { setActiveModule('lifecycle'); generateSql('lifecycle', {action: 'Status Check'}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-emerald-500/10 text-emerald-400 rounded-lg group-hover:bg-emerald-500 group-hover:text-slate-950 transition">
                                            ⚡
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">ORCL</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">Instance Lifecycle</h3>
                                    <p className="text-xs text-slate-400 mt-1">Manage database startup, shutdown modes, and alert logs.</p>
                                </div>

                                {/* Module 4: Performance */}
                                <div onClick={() => { setActiveModule('performance'); generateSql('performance', {}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-rose-500/10 text-rose-400 rounded-lg group-hover:bg-rose-500 group-hover:text-slate-950 transition">
                                            📊
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">ORCLPDB</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">Performance</h3>
                                    <p className="text-xs text-slate-400 mt-1">Inspect active sessions, top SQL IDs, wait events, and terminate blocks.</p>
                                </div>

                                {/* Module 5: RMAN Backups */}
                                <div onClick={() => { setActiveModule('rman'); generateSql('rman', {}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-indigo-500/10 text-indigo-400 rounded-lg group-hover:bg-indigo-500 group-hover:text-slate-950 transition">
                                            🛡️
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">RMAN</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">RMAN Backups</h3>
                                    <p className="text-xs text-slate-400 mt-1">Schedule, monitor, and verify compressed backup sets and archivelogs.</p>
                                </div>

                                {/* Module 6: Audit History */}
                                <div onClick={() => { setActiveModule('audit'); generateSql('audit', {username: 'SYS'}); }} 
                                     className="bg-slate-900 hover:bg-slate-800/80 border border-slate-800 hover:border-cyan-500/50 p-5 rounded-xl cursor-pointer transition group">
                                    <div className="flex justify-between items-start mb-3">
                                        <div className="p-2 bg-purple-500/10 text-purple-400 rounded-lg group-hover:bg-purple-500 group-hover:text-slate-950 transition">
                                            📜
                                        </div>
                                        <span className="text-xs text-slate-500 font-mono">ORCLPDB</span>
                                    </div>
                                    <h3 className="font-semibold text-white text-base">Audit History</h3>
                                    <p className="text-xs text-slate-400 mt-1">Review operational approvals, user action trails, and execution logs.</p>
                                </div>

                            </div>
                        </div>

                        {/* Interactive Oracle 19c SQL Generator Console */}
                        <div className="bg-slate-900 border border-slate-800 rounded-xl p-5 shadow-xl">
                            <div className="flex justify-between items-center mb-3">
                                <div className="flex items-center gap-2">
                                    <span className="w-3 h-3 rounded-full bg-cyan-500 animate-pulse"></span>
                                    <h3 className="font-semibold text-white text-sm">Oracle 19c SQL*Plus & PL/SQL Generator Console</h3>
                                </div>
                                <button 
                                    onClick={() => copyToClipboard(sqlOutput)}
                                    className="bg-slate-800 hover:bg-slate-700 text-cyan-400 border border-slate-700 px-3 py-1.5 rounded-md text-xs font-medium transition flex items-center gap-1.5">
                                    {copied ? '✓ Copied!' : 'Copy SQL/PL*SQL'}
                                </button>
                            </div>
                            <pre className="bg-slate-950 border border-slate-900 p-4 rounded-lg text-emerald-400 font-mono text-xs overflow-x-auto leading-relaxed">
                                {sqlOutput}
                            </pre>
                            <p className="text-[11px] text-slate-500 mt-2">
                                * Generated scripts target your active Oracle 19c instance at <code className="text-slate-400">//192.168.1.184:1521/ORCL</code> inside pluggable database <code className="text-slate-400">ORCLPDB</code>.
                            </p>
                        </div>

                    </main>

                    {/* Footer */}
                    <footer className="bg-slate-900 border-t border-slate-800 py-4 px-6 text-center text-xs text-slate-500 mt-auto">
                        Oracle DBA CI/CD Lab &bull; Managed via Jenkins, SonarQube, Docker, and Argo CD GitOps.
                    </footer>
                </div>
            );
        }

        ReactDOM.render(<App />, document.getElementById('root'));
    </script>
</body>
</html>
