apiVersion: v1
kind: Namespace
metadata:
  name: oracle-dba-lab
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dba-dashboard-app
  namespace: oracle-dba-lab
  labels:
    app: dba-dashboard
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dba-dashboard
  template:
    metadata:
      labels:
        app: dba-dashboard
    spec:
      containers:
      - name: dba-dashboard
        image: harbor.local/oracle/dba-dashboard:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
        env:
        - name: ORACLE_DB_URL
          value: "//192.168.1.188:1521/ORCL"
        - name: ORACLE_PDB
          value: "ORCLPDB"
        resources:
          limits:
            cpu: "250m"
            memory: "256Mi"
          requests:
            cpu: "100m"
            memory: "128Mi"
---
apiVersion: v1
kind: Service
metadata:
  name: dba-dashboard-service
  namespace: oracle-dba-lab
spec:
  type: NodePort
  selector:
    app: dba-dashboard
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080
