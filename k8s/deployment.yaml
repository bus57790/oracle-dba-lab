apiVersion: apps/v1
kind: Deployment
metadata:
  name: oracle-dba-dashboard
  namespace: oracle-dba-lab
spec:
  replicas: 1
  selector:
    matchLabels:
      app: oracle-dba-dashboard
  template:
    metadata:
      labels:
        app: oracle-dba-dashboard
    spec:
      imagePullSecrets:
      - name: dockerhub-secret
      containers:
      - name: oracle-dba-dashboard
        image: bus57790/oracle-dba-lab:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 80
