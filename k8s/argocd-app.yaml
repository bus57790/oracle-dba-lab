apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: oracle-dba-dashboard-gitops
  namespace: argocd
spec:
  project: default
  source:
    repoURL: 'https://github.com/bus57790/oracle-dba-lab.git'
    targetRevision: HEAD
    path: k8s
  destination:
    server: 'https://kubernetes.default.svc'
    namespace: oracle-dba-lab
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
